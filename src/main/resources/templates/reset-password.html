<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${header}">Password Reset Request</title>
</head>
<body style="margin:0;padding:0;background:#f6f7fb;font-family:Arial, Helvetica, sans-serif;">
<div style="max-width:600px;margin:0 auto;padding:24px;">
    <div style="background:#ffffff;border:1px solid #e6e8f0;border-radius:12px;padding:24px;">
        <h2 style="margin:0 0 12px 0;color:#111827;" th:text="${header}">Password Reset Request</h2>
        <p style="margin:0 0 12px 0;color:#374151;">Hi <span th:text="${userName}">User</span>,</p>
        <p style="margin:0 0 16px 0;color:#374151;">Use the verification code below to reset your password:</p>
        <div style="display:inline-block;background:#111827;color:#ffffff;padding:12px 16px;border-radius:10px;font-size:20px;letter-spacing:2px;" th:text="${resetUrl}">000000</div>
        <p style="margin:16px 0 0 0;color:#6b7280;font-size:12px;">If you didn’t request a password reset, you can ignore this email.</p>
    </div>
</div>
</body>
</html>
