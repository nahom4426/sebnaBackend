spring.application.name=sebna

server.port= ${BE_PORT:8993}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# Local secrets for development (gitignored). In Docker every value below comes from environment variables.
spring.config.import=optional:file:./secrets.properties

# Running behind the HTTPS reverse proxy (Caddy) - trust X-Forwarded-* headers
server.forward-headers-strategy=framework
server.shutdown=graceful


spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true

spring.cloud.config.enabled=false

#Jackson Properties
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
spring.jackson.time-zone=UTC

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health
management.health.mail.enabled=false


# App Properties
# JWT_SECRET must be Base64 and at least 32 bytes (generate with: openssl rand -base64 48)
medcoanalytics.app.jwtSecret=${JWT_SECRET:======================sdfljdflsdflksdfj=lfkjflfl===========================}
medcoanalytics.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}


spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB


#smtp mail properties
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

#Custom sender name
mail.custom.sender.name=${MAIL_SENDER_NAME:Sebna}

email.outbox.retry.fixedDelayMs=86400000

spring.file.upload_dir=${UPLOAD_DIR:uploads/}
spring.file.upload_dir_libre=${UPLOAD_DIR_LIBRE:uploads/libre/}


afromessage.api.url=https://api.afromessage.com/api/send
afromessage.api.token=${AFROMESSAGE_TOKEN:}
afromessage.api.identifierId=${AFROMESSAGE_IDENTIFIER_ID:}


# Payment (Chapa)
payment.return-url=${PAYMENT_RETURN_URL:http://localhost:5177/payment}
payment.chapa_verify_url=https://api.chapa.co/v1/transaction/verify/
payment.chapa_verify_transfer_url=https://api.chapa.co/v1/transfers/verify/
payment.api_key=${PAYMENT_API_KEY:}
payment.merchant_id=${PAYMENT_MERCHANT_ID:}
payment.callback_checkout_url=${PAYMENT_CALLBACK_URL:}
payment.chapa_transfer_request_url=https://api.chapa.co/v1/transfers
payment.chapa_request_url=${PAYMENT_CHAPA_REQUEST_URL:}
chapa.direct_pay_url=${CHAPA_DIRECT_PAY_URL:}
chapa.SECRET_KEY=${CHAPA_SECRET_KEY:}


# AWS S3 (the S3 client also reads AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY from the environment)
aws.s3.access-key=${AWS_ACCESS_KEY_ID:}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}
aws.s3.bucket=${AWS_BUCKET:pf-car-images}
aws.s3.region=${AWS_REGION:me-south-1}

spring.file.upload_libre=uploads/

sebna.logs.login.retention-days=90
sebna.logs.login.cleanup-cron=0 0 2 * * *
